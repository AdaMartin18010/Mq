# Docker Compose Kafka 集群配置示例（KRaft 模式）
# 2026-11-20 批次167：原 ZK 模式（confluentinc/cp-kafka:latest + cp-zookeeper）已废弃——
#   Kafka 4.0 起移除 ZooKeeper 模式，cp-kafka:latest 强制 KRaft（缺 KAFKA_PROCESS_ROLES 即启动失败）。
#   改为 apache/kafka:4.4.0 单镜像 KRaft（与 Testing/fixtures/docker-compose-test-env.yml 同口径）。
#   三节点 broker+controller 混合部署，quorum=3；宿主端口语义不变（9092/9093/9094）。
# 监听器语义（2026-11-20 批次174/175 实证）：
#   - 宿主客户端 → localhost:909X（EXTERNAL，宿主端口映射，宿主内 localhost 可达各容器）
#   - 网内客户端 → kafka-N:29092（INTERNAL，容器 DNS；引导经 INTERNAL 时集群视图完整）
#   - EXTERNAL advertised 为 localhost:909X 是宿主视角语义：容器内客户端经 EXTERNAL 引导
#     时会将其他节点解析到自身 localhost（9093/9094 容器内不可达）→ 集群视图残缺。
#     故 healthcheck 一律用 INTERNAL 引导（各节点自身名），否则 api-versions 对 2/3 节点
#     报 ERROR → unhealthy（批次173 观察到的'3 独立单节点/unhealthy'即此根因；
#     INTERNAL 路径复制实测正常：RF=3 全分区 ISR=3）。
services:
  kafka-1:
    image: apache/kafka:4.4.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka-1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-2:
    image: apache/kafka:4.4.0
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9093,INTERNAL://kafka-2:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "kafka-2:29092"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-3:
    image: apache/kafka:4.4.0
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9094,INTERNAL://kafka-3:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "kafka-3:29092"]
      interval: 10s
      timeout: 5s
      retries: 12
