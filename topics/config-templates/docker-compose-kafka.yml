# Docker Compose Kafka 集群配置示例（KRaft 模式）
# 2026-11-20 批次167：原 ZK 模式（confluentinc/cp-kafka:latest + cp-zookeeper）已废弃——
#   Kafka 4.0 起移除 ZooKeeper 模式，cp-kafka:latest 强制 KRaft（缺 KAFKA_PROCESS_ROLES 即启动失败）。
#   改为 apache/kafka:4.4.0 单镜像 KRaft（与 Testing/fixtures/docker-compose-test-env.yml 同口径）。
#   三节点 broker+controller 混合部署，quorum=3；宿主端口语义不变（9092/9093/9094）。
services:
  kafka-1:
    image: apache/kafka:4.4.0
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:19093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka-1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:19093,2@kafka-2:19093,3@kafka-3:19093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-2:
    image: apache/kafka:4.4.0
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "9093:9092"
    environment:
