# Microcks async-minion 1.15.0 接线配置（批次169 H1）
# 机制: Quarkus runner jar 自动加载 /deployments/config/application.properties（官方 async-addon.yml 同款挂载点）
# 本文件只覆盖与官方默认不同的项: 连接器地址 + 3 处 Kafka bootstrap（内置默认均指向 localhost）
# serviceaccount 凭据沿用内置默认（realm 已实证 client_credentials 200, 2026-11-20）

# minion -> Microcks app 连接器（内置默认 http://localhost:8080）
io.github.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://mq-microcks:8080

# Kafka bootstrap（内置默认 localhost:9092, 共 3 处）
kafka.bootstrap.servers=kafka-1:29092,kafka-2:29092,kafka-3:29092
mp.messaging.incoming.microcks-services-updates.bootstrap.servers=kafka-1:29092,kafka-2:29092,kafka-3:29092
mp.messaging.incoming.microcks-asyncapi-triggers.bootstrap.servers=kafka-1:29092,kafka-2:29092,kafka-3:29092

# Keycloak 控制面（minion 容器内不可达 app 下发的 PUBLIC url localhost:18080；
# 官方属性 keycloak.auth.url 覆盖 Microcks config 下发值, 2026-11-20 实证）
keycloak.auth.url=http://keycloak:8080
